ATTACK_METHOD : "inference"
ATTACK_CONFIG: 
    ROOFTOP_ANNOTATE: null
    ADVERSARIAL_PATCH: null
    DETECTOR: "rcnn"
    TARGET_COMPONENT: AnchorHeadSingle
    TRAINING_COMPONENTS: []

DATA_CONFIG:
    _BASE_CONFIG_: configs/dataset_configs/outdoor_demo_dataset.yaml
    GTBOXES: null
    
    DATA_PROCESSOR:
        - NAME: mask_points_and_boxes_outside_range
          REMOVE_OUTSIDE_BOXES: True

        - NAME: transform_points_to_voxels_placeholder
          VOXEL_SIZE: [0.05, 0.05, 0.1]
          MAX_POINTS_PER_VOXEL: 5
          MAX_NUMBER_OF_VOXELS: {
            'train': 16000,
            'test': 40000
          }
    
    ADVANCED_DATA_PROCESSOR: 
        - NAME: remove_reflective
        - NAME: differentiable_voxelize
          VOXEL_SIZE: [0.05, 0.05, 0.1]
          MAX_POINTS_PER_VOXEL: 5
          MAX_NUMBER_OF_VOXELS: {
            'train': 16000,
            'test': 40000
          }

MODEL:
    _BASE_CONFIG_: configs/model_configs/pv_rcnn.yaml
    CKPT_PATH: "/home/ksas/Public/model_zoo/pcdet/pv_rcnn_8369.pth"