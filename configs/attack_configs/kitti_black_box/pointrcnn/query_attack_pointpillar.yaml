ATTACK_METHOD : "query"

ATTACK_CONFIG: 
    ROOFTOP_ANNOTATE: "data/rooftop_approximation/rooftop_appro_kitti.pkl"
    DETECTOR: "single"
    TARGET_COMPONENT: null
    TRAINING_COMPONENTS: []

SURROGATE_ATTACK_CONFIG: 
    ROOFTOP_ANNOTATE: "data/rooftop_approximation/rooftop_appro_kitti.pkl"
    DETECTOR: "rcnn"
    TARGET_COMPONENT: "PointHeadBox"
    TRAINING_COMPONENTS: []

DATA_CONFIG:
    _BASE_CONFIG_: configs/dataset_configs/kitti_dataset.yaml

    POINT_CLOUD_RANGE: [0, -39.68, -3, 69.12, 39.68, 1]
    DATA_PROCESSOR:
        -   NAME: mask_points_and_boxes_outside_range
            REMOVE_OUTSIDE_BOXES: True

        -   NAME: shuffle_points
            SHUFFLE_ENABLED: {
                'train': True,
                'test': False
            }

        - NAME: transform_points_to_voxels_placeholder
          VOXEL_SIZE: [0.16, 0.16, 4]
          MAX_POINTS_PER_VOXEL: 32
          MAX_NUMBER_OF_VOXELS: {
            'train': 16000,
            'test': 40000
          }

    ADVANCED_DATA_PROCESSOR: 
        - NAME: remove_reflective
        - NAME: differentiable_voxelize
          VOXEL_SIZE: [0.16, 0.16, 4]
          MAX_POINTS_PER_VOXEL: 32
          MAX_NUMBER_OF_VOXELS: {
            'train': 16000,
            'test': 40000
          }

SURROGATE_DATA_CONFIG:
    _BASE_CONFIG_: configs/dataset_configs/kitti_dataset.yaml

    DATA_PROCESSOR:
        -   NAME: mask_points_and_boxes_outside_range
            REMOVE_OUTSIDE_BOXES: True

        -   NAME: shuffle_points
            SHUFFLE_ENABLED: {
                'train': True,
                'test': False
            }
    
    ADVANCED_DATA_PROCESSOR: 
        -   NAME: remove_reflective
        -   NAME: sample_points_gpu
            NUM_POINTS: {
                'train': 16384,
                'test': 16384
            }



MODEL:
    _BASE_CONFIG_: configs/model_configs/pointpillar.yaml
    CKPT_PATH: "/home/ksas/Public/model_zoo/pcdet/pointpillar_7728.pth"
SURROGATE_MODEL:
    _BASE_CONFIG_: configs/model_configs/pointrcnn.yaml
    CKPT_PATH: "/home/ksas/Public/model_zoo/pcdet/pointrcnn_7870.pth"