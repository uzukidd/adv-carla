CLASS_NAMES: ['Car', 'Pedestrian', 'Cyclist']

ATTACK_CONFIG: 
    ROOFTOP_ANNOTATE: "/home/ksas/uzuki_space/vehicle-shape-reconstruction/rooftop_appro_std.pkl"
    DETECTOR: "rcnn"
    TARGET_COMPONENT: null

DATA_CONFIG:
    _BASE_CONFIG_: configs/dataset_configs/kitti_dataset.yaml

    DATA_PROCESSOR:
        - NAME: mask_points_and_boxes_outside_range
          REMOVE_OUTSIDE_BOXES: True

        - NAME: shuffle_points
          SHUFFLE_ENABLED: {
            'train': True,
            'test': False
          }

        - NAME: transform_points_to_voxels_placeholder
          VOXEL_SIZE: [0.05, 0.05, 0.1]
          MAX_POINTS_PER_VOXEL: 5
          MAX_NUMBER_OF_VOXELS: {
            'train': 16000,
            'test': 40000
          }
    
    ADVANCED_DATA_PROCESSOR:
      - NAME: differentiable_voxelize
        VOXEL_SIZE: [0.05, 0.05, 0.1]
        MAX_POINTS_PER_VOXEL: 5
        MAX_NUMBER_OF_VOXELS: {
          'train': 16000,
          'test': 40000
        }

MODEL:
    _BASE_CONFIG_: configs/model_configs/pv_rcnn.yaml
    CKPT_PATH: "/home/ksas/Public/model_zoo/pcdet/pv_rcnn_8369.pth"