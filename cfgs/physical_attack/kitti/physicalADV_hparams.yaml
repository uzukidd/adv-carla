fit:
  trainer:
    logger:
          class_path: lightning.pytorch.loggers.WandbLogger
          init_args:
            project: "physical-attack"
            log_model: "all"
    devices: 1
  data:
    disabled_processing: ['constant_reflectness']
    class_names: ['Car', 'Pedestrian', 'Cyclist']
    batch_size: 8
    workers: 63
  model:
    optimizer: 
      class_path: torch.optim.Adam
      init_args:
        lr: 1e-3
    
test:
  trainer:
    logger:
        class_path: lightning.pytorch.loggers.WandbLogger
        init_args:
          project: "physical-attack"
          log_model: "all"
    devices: 4
  data:
    disabled_processing: ['constant_reflectness']
    class_names: ['Car', 'Pedestrian', 'Cyclist']
    batch_size: 8
    workers: 63
    